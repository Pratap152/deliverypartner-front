apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply plugin: 'com.google.gms.google-services'
apply from: project(':react-native-config').projectDir.getPath() + "/dotenv.gradle"
 
react {
    autolinkLibrariesWithApp()
}
 
/**
* Production: enable R8/Proguard for release builds.
* This reduces APK/AAB size and obfuscates Java/Kotlin bytecode.
*/
def enableProguardInReleaseBuilds = true
 
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'
 
android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion
 
    namespace "com.delpart"
 
    defaultConfig {
        applicationId "com.delpart"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
 
        versionCode project.hasProperty("VERSION_CODE")
                ? project.VERSION_CODE.toInteger()
                : 2
 
        versionName project.hasProperty("VERSION_NAME")
                ? project.VERSION_NAME
                : "1.0.1"
 
        ndk {
            abiFilters "arm64-v8a"
        }
    }
 
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
 
        release {
            if (project.hasProperty("MYAPP_UPLOAD_STORE_FILE")) {
                storeFile file(MYAPP_UPLOAD_STORE_FILE)
                storePassword MYAPP_UPLOAD_STORE_PASSWORD
                keyAlias MYAPP_UPLOAD_KEY_ALIAS
                keyPassword MYAPP_UPLOAD_KEY_PASSWORD
            } else {
                // Temporary fallback only.
                // For Play Store production, configure upload-keystore.jks.
                storeFile file('debug.keystore')
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }
 
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
 
        release {
            signingConfig signingConfigs.release
 
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources true
 
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"),
                    "proguard-rules.pro"
        }
    }
}
 
dependencies {
    implementation("com.facebook.react:react-android")
 
    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
 
project.ext.vectoricons = [
    iconFontNames: [
        'MaterialIcons.ttf',
        'EvilIcons.ttf',
        'AntDesign.ttf',
        'Entypo.ttf',
        'Feather.ttf',
        'FontAwesome.ttf',
        'FontAwesome5.ttf',
        'FontAwesome5Brands.ttf',
        'FontAwesome6.ttf',
        'FontAwesome6Brands.ttf',
        'Fontisto.ttf',
        'Foundation.ttf',
        'Ionicons.ttf',
        'Lucide.ttf',
        'MaterialDesignIcons.ttf',
        'Octicons.ttf',
        'SimpleLineIcons',
        'Zocial.ttf'
    ]
]
 
apply from: file("../../node_modules/react-native-vector-icons/fonts.gradle")